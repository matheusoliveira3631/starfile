name: CI

# Push só na master; o resto passa por PR. Com push em toda branch, cada commit
# de um PR rodaria duas vezes (uma pelo push, outra pelo pull_request).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Nenhum job precisa escrever no repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, testes e synth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      # Gera o template e os bundles das Lambdas. Pega erro de esbuild e de CloudFormation sem precisar de conta.
      - run: npm run synth

  integration:
    name: Integração (LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      localstack:
        image: localstack/localstack:4
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb
          # Sem isso o LocalStack aceita URL assinada vencida ou adulterada e o teste não prova nada.
          S3_SKIP_SIGNATURE_VALIDATION: "0"
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
